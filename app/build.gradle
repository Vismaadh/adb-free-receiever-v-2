plugins {
    id 'com.android.application'
}

def buildNumber = project.findProperty("buildNumber") ?: "LOCAL"
def gitCommit = project.findProperty("gitCommit") ?: "LOCAL"
def shortGitCommit = gitCommit.toString().take(7)
def buildVersionName = "1.0-build${buildNumber}-${shortGitCommit}"

android {
    namespace 'com.example.adbfreereceiver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.adbfreereceiver'
        minSdk 29
        targetSdk 34
        versionCode buildNumber.isInteger() ? buildNumber.toInteger() : 1
        versionName buildVersionName

        buildConfigField "String", "BUILD_NUMBER", "\"${buildNumber}\""
        buildConfigField "String", "GIT_COMMIT", "\"${gitCommit}\""
    }

    buildFeatures {
        buildConfig true
    }

    applicationVariants.all { variant ->
        if (variant.name == "debug") {
            variant.outputs.all {
                outputFileName = "adb-free-receiver-v${buildVersionName}.apk"
            }
        }
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
